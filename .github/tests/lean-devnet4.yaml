participants: []

# 14-node Lean devnet4. Each participant pins the devnet4 image
# explicitly via `lean_image:`; the package's DEFAULT_LEAN_IMAGES point
# at `:latest` so they don't rot when a new devnet ships.
#
# Single aggregator on ethlambda_0. Lighthouse omitted: the published
# `hopinheimer/lighthouse:latest` image is still on the single-key
# (devnet3) GENESIS_VALIDATORS layout and won't reach consensus with
# the devnet4 nodes.
lean_participants:
  - lean_type: ethlambda
    lean_image: ghcr.io/lambdaclass/ethlambda:devnet4
    count: 1
    validator_count: 1
    is_aggregator: true
  - lean_type: ethlambda
    lean_image: ghcr.io/lambdaclass/ethlambda:devnet4
    count: 1
    validator_count: 1
    is_aggregator: false
  - lean_type: ream
    lean_image: ghcr.io/reamlabs/ream:latest-devnet4
    count: 2
    validator_count: 1
    is_aggregator: false
  - lean_type: zeam
    lean_image: blockblaz/zeam:devnet4
    count: 2
    validator_count: 1
    is_aggregator: false
  - lean_type: qlean
    lean_image: qdrvm/qlean-mini:devnet-4-amd64
    count: 2
    validator_count: 1
    is_aggregator: false
  - lean_type: lantern
    lean_image: piertwo/lantern:v0.0.4
    count: 2
    validator_count: 1
    is_aggregator: false
  - lean_type: grandine
    lean_image: sifrai/lean:devnet-4
    count: 2
    validator_count: 1
    is_aggregator: false
  - lean_type: gean
    lean_image: ghcr.io/geanlabs/gean:devnet4
    count: 2
    validator_count: 1
    is_aggregator: false

lean_network_params:
  genesis_delay: 180
  active_epoch: 18
  attestation_committee_count: 1

additional_services: []
